version: "3.9"

services:
  app:
    build: .
    working_dir: /app
    expose:
      - "8000"
    volumes:
      - laravel_storage:/app/storage
    depends_on:
      - mysql
    networks:
      - laravel_net

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: laravel_app
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel_net

networks:
  laravel_net:

volumes:
  mysql_data:
  laravel_storage:
