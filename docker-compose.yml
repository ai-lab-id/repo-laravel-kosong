services:
  app:
    build: .
    container_name: laravel_app
    expose:
      - "80"
    depends_on:
      - mysql
    networks:
      - laravel_net
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://testing-laravel-kosong.ai-lab.id
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: laravel_app
      DB_USERNAME: laravel
      DB_PASSWORD: secret

  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel_app
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel_net

networks:
  laravel_net:
    driver: bridge

volumes:
  mysql_data:
